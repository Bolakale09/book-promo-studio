name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "BPS_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key from the repository secrets."
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret - this APK is signed with a temporary key, so to update it you must uninstall the old app first. See android/README.md."
          fi

      - name: Build APK
        env:
          BPS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BPS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BPS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        run: |
          # Put the compiler errors where they are easy to read: the run's summary page.
          grep -E "^e: |error:|\* What went wrong" -A 4 "$RUNNER_TEMP/build.log" | head -n 80 > "$RUNNER_TEMP/errors.txt" || true
          [ -s "$RUNNER_TEMP/errors.txt" ] || tail -n 60 "$RUNNER_TEMP/build.log" > "$RUNNER_TEMP/errors.txt"
          msg=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errors.txt" | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build failed::$msg"

      - name: Name the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/BookPromoStudio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BookPromoStudio-apk
          path: out/BookPromoStudio.apk

      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Book Promo Studio for Android (build ${{ github.run_number }})
          body: |
            Install on your phone: open this page on the phone, tap **BookPromoStudio.apk**, then allow "Install unknown apps" for your browser when asked.
            Built from ${{ github.sha }}.
          files: out/BookPromoStudio.apk
          make_latest: true
