[server]
maxUploadSize = 500

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#F0B429"
backgroundColor = "#0E0F13"
secondaryBackgroundColor = "#181A23"
textColor = "#ECE7DF"
borderColor = "#2A2D38"
linkColor = "#F7D27A"
font = "Inter, 'Segoe UI', sans-serif"
headingFont = "Fraunces, Georgia, serif"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#13141B"
secondaryBackgroundColor = "#1C1E28"
