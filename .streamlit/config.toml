[server]
maxUploadSize = 500

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#FF5A36"
backgroundColor = "#0B0B14"
secondaryBackgroundColor = "#14141F"
textColor = "#F5F2EA"
borderColor = "#2A2D38"
linkColor = "#FF9A7A"
font = "Inter, 'Segoe UI', sans-serif"
headingFont = "Fraunces, Georgia, serif"
baseRadius = "14px"
buttonRadius = "14px"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#13141B"
secondaryBackgroundColor = "#1C1E28"
